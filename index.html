<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Rick and Morty Database</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* Mantenemos tus estilos originales */
        @font-face {
            font-family: 'MiFuenteRick';
            src: url('rick.ttf') format('truetype');
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Open Sans', sans-serif; /* Fuente de Jordy aplicada */
        }

        h2, h3 {
            font-family: 'MiFuenteRick', sans-serif;
            color: #b7e152;
        }

        /* HEADER DE JORDY - Ajustes necesarios */
        header {
            position: relative;
            width: 100%;
            overflow: hidden;
            height: 70vh;
        }

        /* Tus estilos de personajes y episodios se mantienen igual */
        #character-info {
            background: linear-gradient(160deg, #0f0014, #1c0026);
            border: 3px solid #8aff00;
            border-radius: 20px;
            box-shadow: 0 0 30px #39ff14;
            min-height: 520px;
        }

        #characters .card {
            background: #140018;
            border: 2px solid #8aff00;
            border-radius: 12px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        #characters .card:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #39ff14;
        }

        #characters .card.selected {
            border-color: #00fff2;
            box-shadow: 0 0 25px #00fff2;
        }

        .texto-temporada {
            font-style: italic;
            color: white;
            text-shadow: 2px 2px 0 #000;
        }

        #seccion-episodios {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('fondocarousel.png');
            background-size: cover;
            background-position: center;
            border: 3px solid #b7e152;
            border-radius: 20px;
        }

        .titulo-episodios {
            font-family: 'MiFuenteRick', sans-serif;
            font-size: 3rem;
            color: #b7e152;
            background-color: black;
            padding: 10px 40px;
            border: 3px solid #b7e152;
            border-radius: 10px;
            text-shadow: 4px 4px 0px #000;
            display: inline-block;
            transform: rotate(-3deg);
        }
    </style>
</head>

<body>

    <header>
        <img src="img/header.jpg" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit:cover" alt="Rick and Morty header">
        <div class="position-absolute top-0 start-0 w-100 bg-dark opacity-75" style="height: 10%;"></div>
        <div class="position-relative h-100 text-light">
            <div class="d-flex justify-content-between align-items-start px-4 pt-3"> 
                <span class="fw-bold text-success">Rick & Morty Database</span>
                <div class="d-flex gap-2"> 
                    <button class="btn btn-outline-light btn-sm">HOME</button> 
                    <button class="btn btn-warning btn-sm text-dark">SIGN IN</button> 
                </div>
            </div>
            
            <div class="position-absolute top-50 start-50 translate-middle w-50">
                <input id="searchInput" type="text" class="form-control form-control-lg text-center" placeholder="Buscar personaje...">
            </div>

            <div class="position-absolute bottom-0 start-50 translate-middle-x pb-5">
                <div class="d-flex gap-3 flex-wrap justify-content-center"> 
                    <button class="btn btn-lg text-white" style="background-color: purple;">Personajes</button> 
                    <button class="btn btn-lg text-white" style="background-color: purple;">Comunidad</button> 
                    <button class="btn btn-lg text-white" style="background-color: purple;">Universos</button> 
                    <button class="btn btn-lg text-white" style="background-color: purple;">Episodios</button> 
                </div>
            </div>
        </div>
    </header>
    <div class="container-fluid mt-4">
        <div class="row">

            <aside class="col-lg-3 col-md-4 border-end border-secondary p-3">
                <h5 class="text-info">🔍 Filtros</h5>
                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select id="statusFilter" class="form-select">
                        <option value="">Todos</option>
                        <option value="alive">Vivo</option>
                        <option value="dead">Muerto</option>
                        <option value="unknown">Desconocido</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Especie</label>
                    <select id="speciesFilter" class="form-select">
                        <option value="">Todas</option>
                        <option value="Human">Humano</option>
                        <option value="Alien">Alien</option>
                    </select>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-success" onclick="applyFilters()">Aplicar filtros</button>
                    <button class="btn btn-outline-secondary" onclick="resetFilters()">Limpiar</button>
                </div>
            </aside>

            <main class="col-lg-9 col-md-8 p-4">
                <section class="container-fluid mb-5">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div id="character-info" class="p-4 text-center">
                                <h3>PERSONAJE</h3>
                                <p class="text-muted">Selecciona un personaje</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <ul id="characters" class="row row-cols-3 row-cols-sm-4 row-cols-md-5 g-3 list-unstyled">
                                </ul>
                        </div>
                    </div>
                </section>

                <section id="seccion-episodios" class="container-fluid p-4 shadow-lg">
                    <div class="text-center mb-4">
                        <h2 class="titulo-episodios">EPISODIOS</h2>
                    </div>
                    <div id="carouselTemporadas" class="carousel slide">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <div id="temporadas-pag-1" class="row justify-content-center gx-3"></div>
                            </div>
                            <div class="carousel-item">
                                <div id="temporadas-pag-2" class="row justify-content-center gx-3"></div>
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselTemporadas" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselTemporadas" data-bs-slide="next">
                            <span class="carousel-control-next-icon"></span>
                        </button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        // Mantenemos tu lógica de JavaScript que ya funciona perfectamente
        let currentData = [];
        const list = document.getElementById("characters");
        const info = document.getElementById("character-info");

        function loadCharacters() {
            fetch("https://rickandmortyapi.com/api/character")
                .then(res => res.json())
                .then(data => {
                    currentData = data.results;
                    renderCharacters(currentData);
                });
        }

        function renderCharacters(data) {
            list.innerHTML = "";
            data.slice(0, 15).forEach(c => {
                const li = document.createElement("li");
                li.className = "col";
                li.innerHTML = `
                    <div class="card p-2 text-center">
                        <img src="${c.image}" class="img-fluid">
                        <div class="card-title" style="font-size:0.7rem">${c.name}</div>
                    </div>`;
                li.querySelector(".card").onclick = () => selectCharacter(c, li.querySelector(".card"));
                list.appendChild(li);
            });
        }

        function selectCharacter(c, card) {
            document.querySelectorAll("#characters .card").forEach(x => x.classList.remove("selected"));
            card.classList.add("selected");
            info.innerHTML = `
                <h3>${c.name}</h3>
                <img src="${c.image}" class="img-fluid rounded mb-3" style="max-width:260px;">
                <p><strong>Estado:</strong> ${c.status}</p>
                <p><strong>Especie:</strong> ${c.species}</p>
                <p><strong>Género:</strong> ${c.gender}</p>
                <p><strong>Origen:</strong> ${c.origin.name}</p>`;
        }

        function renderTemporadas() {
            const pag1 = document.getElementById("temporadas-pag-1");
            const pag2 = document.getElementById("temporadas-pag-2");
            [1,2,3,4,5,6,7,8].forEach((n,i) => {
                const card = `
                    <div class="col text-center" style="max-width:180px;">
                        <img src="https://rickandmortyapi.com/api/character/avatar/${n}.jpeg"
                             class="img-fluid rounded border border-4 border-dark img-temporada mb-2">
                        <h6 class="texto-temporada">TEMPORADA ${n}</h6>
                    </div>`;
                if(i < 5) pag1.innerHTML += card; else pag2.innerHTML += card;
            });
        }

        loadCharacters();
        renderTemporadas();
    </script>
</body>
</html>
