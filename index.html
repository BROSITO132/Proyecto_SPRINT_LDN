<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Rick and Morty Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'MiFuenteRick';
            /* Le ponemos un nombre único para que no se confunda */
            src: url('rick.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .titulo-episodios {
            /* Usamos el nombre exacto que pusimos arriba y el !important */
            font-family: 'MiFuenteRick', sans-serif !important;

            font-size: 4rem;
            color: #b7e152;
            background-color: black;
            padding: 10px 40px;
            border: 3px solid #b7e152;
            border-radius: 10px;
            text-shadow: 4px 4px 0px #000;
            display: inline-block;
            transform: rotate(-3deg);
            margin-bottom: 20px;
        }

        /* 2. Estilo para el texto "Temporada X" */
        .texto-temporada {
            font-family: 'Arial Black', sans-serif;
            font-style: italic;
            color: #ffffff;
            /* Cambiamos a blanco si el fondo es muy oscuro */
            text-shadow: 2px 2px 0px #000, 0px 0px 10px #b7e152;
            /* Doble sombra: negra para leer bien, verde para el estilo */
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* 3. Efecto en las imágenes para que resalten */
        .img-temporada {
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .img-temporada:hover {
            transform: scale(1.05);
            /* Se agranda un poco al pasar el ratón */
            border-color: #b7e152 !important;
            /* El borde cambia a verde */
        }

        /* Esto ajusta el tamaño de la sección dependiendo de la pantalla */
        #seccion-episodios {
            background-attachment: scroll;
            /* Para que el fondo no haga saltos raros en móvil */
            background-position: center !important;
            transition: all 0.3s ease;
        }

        /* Ajuste para que las tarjetas no se peguen al borde en pantallas pequeñas */
        @media (max-width: 768px) {
            .texto-temporada {
                font-size: 0.8rem;
                /* Texto más pequeño en móviles */
            }

            #seccion-episodios {
                padding: 20px 10px !important;
            }
        }
    </style>
</head>

<body class="bg-dark text-light" style="font-family:'Open Sans', sans-serif;">
    <header class="position-relative w-100 overflow-hidden" style="height:70vh">
        <img src="img/header.jpg" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit:cover"
            alt="Rick and Morty header">
        <div class="position-absolute top-0 start-0 w-100 bg-dark opacity-75" style="height: 10%;"></div>
        <div class="position-relative h-100 text-light">
            <div class="d-flex justify-content-between align-items-start px-4 pt-3"> <span
                    class="fw-bold text-success">Rick & Morty</span>
                <div class="d-flex gap-2"> <button class="btn btn-outline-light btn-sm">HOME</button> <button
                        class="btn btn-warning btn-sm text-dark">SIGN IN</button> </div>
            </div>
            <div class="d-flex justify-content-center align-items-center h-100">
            </div>
            <div class="position-absolute bottom-0 start-50 translate-middle-x pb-5">
                <div class="d-flex gap-5"> <button class="btn btn-lg text-white"
                        style="background-color: purple;">Personajes</button> <button class="btn btn-lg text-white"
                        style="background-color: purple;">Comunidad</button> <button class="btn btn-lg text-white"
                        style="background-color: purple;">Universos</button> <button class="btn btn-lg text-white"
                        style="background-color: purple;">Episodios</button> </div>
            </div>
        </div>
    </header>




    <!-- ================= CONTENIDO ================= -->
    <div class="container-fluid min-vh-100 d-flex flex-column">

        <div class="row flex-grow-1">

            <!-- ASIDE -->
            <aside class="col-lg-3 col-md-4 border-end border-secondary p-3">
                <h5 class="text-info">🔍 Filtros</h5>

                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select id="statusFilter" class="form-select">
                        <option value="">Todos</option>
                        <option value="alive">Vivo</option>
                        <option value="dead">Muerto</option>
                        <option value="unknown">Desconocido</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Especie</label>
                    <select id="speciesFilter" class="form-select">
                        <option value="">Todas</option>
                        <option value="Human">Humano</option>
                        <option value="Alien">Alien</option>
                    </select>
                </div>

                <div class="d-grid gap-2">
                    <button class="btn btn-success" onclick="applyFilters()">Aplicar filtros</button>
                    <button class="btn btn-outline-secondary" onclick="resetFilters()">Limpiar</button>
                </div>
            </aside>

            <!-- MAIN -->
            <main class="col-lg-9 col-md-8 p-4">

                <section class="bg-secondary p-4 rounded mb-4 shadow-sm">
                    <h4>Bienvenido</h4>
                    <p>Explora personajes reales gracias a la API pública.</p>
                    <span class="badge bg-warning text-dark">Tema: Rick and Morty API</span>
                </section>

                <section class="bg-dark border border-secondary rounded p-3 mb-4">
                    <h5>Personajes encontrados (<span id="count">0</span>)</h5>
                </section>

                <div class="d-flex justify-content-center gap-3 mb-4">
                    <button class="btn btn-outline-light" onclick="changePage(-1)">Anterior</button>
                    <button class="btn btn-outline-light" onclick="changePage(1)">Siguiente</button>
                </div>

                <ul id="characters" class="row row-cols-2 row-cols-md-4 g-3 list-unstyled"></ul>

                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button class="btn btn-outline-light" onclick="changePage(-1)">Anterior</button>
                    <button class="btn btn-outline-light" onclick="changePage(1)">Siguiente</button>
                </div>

                <!-- CONTENEDOR 3: Grid de personajes -->
                <section class="container-fluid">
                    <ul id="characters"
                        class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-4 g-3 list-unstyled">
                        <!-- row = fila de Bootstrap para el grid -->
                        <!-- row-cols-* = define cuántas columnas según tamaño de pantalla -->
                        <!-- g-3 = gap entre columnas y filas -->
                        <!-- list-unstyled = quitar bullets del ul -->
                        <!-- Las cards se insertan dinámicamente con JS -->
                    </ul>
                </section>

                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button class="btn btn-outline-light" onclick="changePage(-1)">Anterior</button>
                    <button class="btn btn-outline-light" onclick="changePage(1)">Siguiente</button>
                </div>
                
                <!--CROUSEL DE ESPISODIOS-->
                <section id="seccion-episodios" class="container-fluid rounded mb-4 p-4 shadow-lg" style="background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('fondocarousel.png') !important; 
           background-size: cover !important; 
           background-position: center !important;
           background-repeat: no-repeat !important;
           border: 3px solid #b7e152;">
                    <div class="text-center mb-4">
                        <h2 class="titulo-episodios">
                            EPISODIOS
                        </h2>
                    </div>
                    <div id="carouselTemporadas" class="carousel slide">

                        <div class="carousel-inner">

                            <div class="carousel-item active">
                                <div id="temporadas-pag-1" class="row gx-2 justify-content-center p-4">
                                </div>
                            </div>

                            <div class="carousel-item">
                                <div id="temporadas-pag-2" class="row gx-2 justify-content-center p-4">
                                </div>
                            </div>

                        </div>

                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselTemporadas"
                            data-bs-slide="prev" style="width: 5%;">
                            <span class="bg-dark rounded-circle d-flex align-items-center justify-content-center"
                                style="width: 40px; height: 40px;">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            </span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselTemporadas"
                            data-bs-slide="next" style="width: 5%;">
                            <span class="bg-dark rounded-circle d-flex align-items-center justify-content-center"
                                style="width: 40px; height: 40px;">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            </span>
                        </button>
                    </div>


                </section>

            </main>
        </div>

        <!-- FOOTER -->
        <footer class="bg-black text-center py-2">
            <small>Rick and Morty Database - Proyecto Educativo</small>
        </footer>
    </div>

    <!-- ================= JS ================= -->
    <script>
        let page = 1;
        let currentData = [];
        const list = document.getElementById("characters");
        const count = document.getElementById("count");

        function loadCharacters() {
            fetch(`https://rickandmortyapi.com/api/character/?page=${page}`)
                .then(res => res.json())
                .then(data => {
                    currentData = data.results;
                    renderCharacters(currentData);
                });
        }

        function renderCharacters(data) {
            list.innerHTML = "";
            const limited = data.slice(0, 12);
            count.textContent = limited.length;

            limited.forEach(c => {
                list.innerHTML += `
        <li class="col">
            <div class="card h-100 text-center">
                <img src="${c.image}" class="card-img-top">
                <div class="card-body p-2">
                    <h6>${c.name}</h6>
                </div>
            </div>
        </li>`;
            });
        }

        function applyFilters() {
            const status = statusFilter.value;
            const species = speciesFilter.value;

            const filtered = currentData.filter(c =>
                (status === "" || c.status.toLowerCase() === status) &&
                (species === "" || c.species === species)
            );

            renderCharacters(filtered);
        }

        function resetFilters() {
            statusFilter.value = "";
            speciesFilter.value = "";
            renderCharacters(currentData);
        }

        function changePage(dir) {
            page += dir;
            loadCharacters();
        }

        loadCharacters();

        function renderTemporadas() {
            // 1. Buscamos los "huecos" donde vamos a meter las temporadas
            const pag1 = document.getElementById("temporadas-pag-1");
            const pag2 = document.getElementById("temporadas-pag-2");

            // 2. Creamos una lista manual de 8 temporadas (del 1 al 8)
            const totalTemporadas = [1, 2, 3, 4, 5, 6, 7, 8];

            // 3. Empezamos a recorrer esa lista una por una
            totalTemporadas.forEach((numero, index) => {

                // Aquí guardamos el diseño de la tarjeta en una variable
                // Usamos las comillas invertidas `` para poder meter el número de temporada
                let diseñoTarjeta = `
    <div class="col" style="flex: 0 0 20%; max-width: 20%;">
        <div class="text-center">
            <img src="https://rickandmortyapi.com/api/character/avatar/${numero}.jpeg" 
                 class="img-fluid rounded border border-4 border-dark mb-2 img-temporada shadow">
            
            <h5 class="texto-temporada">TEMPORADA ${numero}</h5>
        </div>
    </div>
`;

                // 4. Lógica de reparto: 
                // Si el índice es menor a 5 (posiciones 0,1,2,3,4), va a la página 1.
                if (index < 5) {
                    pag1.innerHTML += diseñoTarjeta;
                } else {
                    // Si no, va a la página 2.
                    pag2.innerHTML += diseñoTarjeta;
                }
            });
        }
        // En lugar de llamar a la función a secas, asegúrate de que el carrusel se inicialice después
        renderTemporadas();

        // Carga inicial
        loadCharacters();

        function renderTemporadas() {
            // 1. Buscamos los "huecos" donde vamos a meter las temporadas
            const pag1 = document.getElementById("temporadas-pag-1");
            const pag2 = document.getElementById("temporadas-pag-2");

            // 2. Creamos una lista manual de 8 temporadas (del 1 al 8)
            const totalTemporadas = [1, 2, 3, 4, 5, 6, 7, 8];

            // 3. Empezamos a recorrer esa lista una por una
            totalTemporadas.forEach((numero, index) => {

                // Aquí guardamos el diseño de la tarjeta en una variable
                // Usamos las comillas invertidas `` para poder meter el número de temporada
                let diseñoTarjeta = `
    <div class="col" style="flex: 0 0 20%; max-width: 20%;">
        <div class="text-center">
            <img src="https://rickandmortyapi.com/api/character/avatar/${numero}.jpeg" 
                 class="img-fluid rounded border border-4 border-dark mb-2 img-temporada shadow">
            
            <h5 class="texto-temporada">TEMPORADA ${numero}</h5>
        </div>
    </div>
`;

                // 4. Lógica de reparto: 
                // Si el índice es menor a 5 (posiciones 0,1,2,3,4), va a la página 1.
                if (index < 5) {
                    pag1.innerHTML += diseñoTarjeta;
                } else {
                    // Si no, va a la página 2.
                    pag2.innerHTML += diseñoTarjeta;
                }
            });
        }
        // En lugar de llamar a la función a secas, asegúrate de que el carrusel se inicialice después
        

        // Esto fuerza a Bootstrap a reconocer el carrusel después de inyectar las fotos
        const myCarousel = new bootstrap.Carousel(document.getElementById('carouselTemporadas'));
    </script>

</body>

</html>
