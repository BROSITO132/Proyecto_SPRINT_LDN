<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Rick and Morty Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'MiFuenteRick';
            /* Le ponemos un nombre único para que no se confunda */
            src: url('rick.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
        }
         h2, h3 {
            font-family: 'MiFuenteRick', sans-serif;
            color: #b7e152;
        }
         /*  SELECTOR PERSONAJES */

        #character-info {
            background: linear-gradient(160deg, #0f0014, #1c0026);
            border: 3px solid #8aff00;
            border-radius: 20px;
            box-shadow: 0 0 30px #39ff14;
            min-height: 520px;
        }

        #characters .card {
            background: #140018;
            border: 2px solid #8aff00;
            border-radius: 12px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        #characters .card:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #39ff14;
        }

        #characters .card.selected {
            border-color: #00fff2;
            box-shadow: 0 0 25px #00fff2;
        }

        #characters img {
            border-radius: 10px;
        }

        .card-title {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 4px;
        }
ºººº

        .titulo-episodios {
            /* Usamos el nombre exacto que pusimos arriba y el !important */
            font-family: 'MiFuenteRick', sans-serif !important;

            font-size: 4rem;
            color: #b7e152;
            background-color: black;
            padding: 10px 40px;
            border: 3px solid #b7e152;
            border-radius: 10px;
            text-shadow: 4px 4px 0px #000;
            display: inline-block;
            transform: rotate(-3deg);
            margin-bottom: 20px;
        }

        /* 2. Estilo para el texto "Temporada X" */
        .texto-temporada {
            font-family: 'Arial Black', sans-serif;
            font-style: italic;
            color: #ffffff;
            /* Cambiamos a blanco si el fondo es muy oscuro */
            text-shadow: 2px 2px 0px #000, 0px 0px 10px #b7e152;
            /* Doble sombra: negra para leer bien, verde para el estilo */
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* 3. Efecto en las imágenes para que resalten */
        .img-temporada {
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .img-temporada:hover {
            transform: scale(1.05);
            /* Se agranda un poco al pasar el ratón */
            border-color: #b7e152 !important;
            /* El borde cambia a verde */
        }

        /* Esto ajusta el tamaño de la sección dependiendo de la pantalla */
        #seccion-episodios {
            background-attachment: scroll;
            /* Para que el fondo no haga saltos raros en móvil */
            background-position: center !important;
            transition: all 0.3s ease;
        }

        /* Ajuste para que las tarjetas no se peguen al borde en pantallas pequeñas */
        @media (max-width: 768px) {
            .texto-temporada {
                font-size: 0.8rem;
                /* Texto más pequeño en móviles */
            }

            #seccion-episodios {
                padding: 20px 10px !important;
            }
        }
    </style>
</head>

<body class="bg-dark text-light" style="font-family:'Open Sans', sans-serif;">
    <header class="position-relative w-100 overflow-hidden" style="height:70vh">
        <img src="img/header.jpg" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit:cover"

        <div class="position-absolute top-0 start-0 w-100 bg-dark opacity-75" style="height: 10%;"></div>
        <div class="position-relative h-100 text-light">
            <div class="d-flex justify-content-between align-items-start px-4 pt-3"> <span
                    class="fw-bold text-success">Rick & Morty</span>
                <div class="d-flex gap-2"> <button class="btn btn-outline-light btn-sm">HOME</button> <button

            </div>
            <div class="d-flex justify-content-center align-items-center h-100">
            </div>

    <!-- ================= CONTENIDO ================= -->
    <div class="container-fluid min-vh-100 d-flex flex-column">

        <div class="row flex-grow-1">

                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select id="statusFilter" class="form-select">
                        <option value="">Todos</option>
                        <option value="alive">Vivo</option>
                        <option value="dead">Muerto</option>
                        <option value="unknown">Desconocido</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Especie</label>

                        <option value="Alien">Alien</option>
                    </select>
                </div>

                <div class="d-grid gap-2">
                    <button class="btn btn-success" onclick="applyFilters()">Aplicar filtros</button>
                    <button class="btn btn-outline-secondary" onclick="resetFilters()">Limpiar</button>
                </div>
            </aside>

            

            <!-- MAIN -->
            <main class="col-lg-9 col-md-8 p-4">

                 <!-- SELECTOR PERSONAJES -->
            <section class="container-fluid mb-5">
                <div class="row g-4">

                    <div class="col-md-6">
                        <div id="character-info" class="p-4 text-center">

                        </div>
                    </div>

                    <div class="col-md-6">

                        </ul>
                    </div>

                </div>
            </section>

                
                <!--CROUSEL DE ESPISODIOS-->
                <section id="seccion-episodios" class="container-fluid rounded mb-4 p-4 shadow-lg" style="background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('fondocarousel.png') !important; 
           background-size: cover !important;

           background-repeat: no-repeat !important;

                    <div class="text-center mb-4">

                            EPISODIOS
                        </h2>
                    </div>
                    <div id="carouselTemporadas" class="carousel slide">

                        <div class="carousel-inner">

                            <div class="carousel-item active">
                                <div id="temporadas-pag-1" class="row gx-2 justify-content-center p-4">
                                </div>
                            </div>

                            <div class="carousel-item">
                                <div id="temporadas-pag-2" class="row gx-2 justify-content-center p-4">
                                </div>
                            </div>

                        </div>

                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselTemporadas"
                            data-bs-slide="prev" style="width: 5%;">
                            <span class="bg-dark rounded-circle d-flex align-items-center justify-content-center"
                                style="width: 40px; height: 40px;">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            </span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselTemporadas"
                            data-bs-slide="next" style="width: 5%;">
                            <span class="bg-dark rounded-circle d-flex align-items-center justify-content-center"
                                style="width: 40px; height: 40px;">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            </span>
                        </button>
                    </div>


                </section>

            </main>
        </div>

        <!-- FOOTER -->
        <footer class="bg-black text-center py-2">
            <small>Rick and Morty Database - Proyecto Educativo</small>
        </footer>
    </div>

    <!-- ================= JS ================= -->
    <script>
        let page = 1;
        let currentData = [];
    const list = document.getElementById("characters");
    const info = document.getElementById("character-info");

    function loadCharacters() {
        fetch("https://rickandmortyapi.com/api/character")
            .then(res => res.json())
            .then(data => {
                currentData = data.results;
                renderCharacters(currentData);
            });
    }

    function renderCharacters(data) {
        list.innerHTML = "";
        data.slice(0, 15).forEach(c => {
            const li = document.createElement("li");
            li.className = "col";
            li.innerHTML = `
                <div class="card p-2 text-center">
                    <img src="${c.image}" class="img-fluid">
                    <div class="card-title">${c.name}</div>
                </div>`;
            li.querySelector(".card").onclick = () => selectCharacter(c, li.querySelector(".card"));
            list.appendChild(li);
        });
    }

    function selectCharacter(c, card) {
        document.querySelectorAll("#characters .card").forEach(x => x.classList.remove("selected"));
        card.classList.add("selected");

        info.innerHTML = `
            <h3>${c.name}</h3>
            <img src="${c.image}" class="img-fluid rounded mb-3" style="max-width:260px;">
            <p><strong>Estado:</strong> ${c.status}</p>
            <p><strong>Especie:</strong> ${c.species}</p>
            <p><strong>Género:</strong> ${c.gender}</p>
            <p><strong>Origen:</strong> ${c.origin.name}</p>`;
    }

        function renderTemporadas() {

            // 3. Empezamos a recorrer esa lista una por una
            totalTemporadas.forEach((numero, index) => {

                // Aquí guardamos el diseño de la tarjeta en una variable
                // Usamos las comillas invertidas `` para poder meter el número de temporada
                let diseñoTarjeta = `
    <div class="col" style="flex: 0 0 20%; max-width: 20%;">
        <div class="text-center">
            <img src="https://rickandmortyapi.com/api/character/avatar/${numero}.jpeg" 
                 class="img-fluid rounded border border-4 border-dark mb-2 img-temporada shadow">
            
            <h5 class="texto-temporada">TEMPORADA ${numero}</h5>
        </div>
    </div>
`;

                // 4. Lógica de reparto: 
                // Si el índice es menor a 5 (posiciones 0,1,2,3,4), va a la página 1.
                if (index < 5) {
                    pag1.innerHTML += diseñoTarjeta;
                } else {
                    // Si no, va a la página 2.
                    pag2.innerHTML += diseñoTarjeta;
                }
            });
        }
        // En lugar de llamar a la función a secas, asegúrate de que el carrusel se inicialice después

                    pag1.innerHTML += diseñoTarjeta;
                } else {
