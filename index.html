<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Rick and Morty Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;700&display=swap" rel="stylesheet">
</head>

<body class="bg-dark text-light" style="font-family:'Open Sans', sans-serif;">
    <header class="position-relative w-100 overflow-hidden" style="height:70vh">
        <img src="img/header.jpg" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit:cover"
            alt="Rick and Morty header">
        <div class="position-absolute top-0 start-0 w-100 bg-dark opacity-75" style="height: 10%;"></div>
        <div class="position-relative h-100 text-light">
            <div class="d-flex justify-content-between align-items-start px-4 pt-3"> <span
                    class="fw-bold text-success">Rick & Morty</span>
                <div class="d-flex gap-2"> <button class="btn btn-outline-light btn-sm">HOME</button> <button
                        class="btn btn-warning btn-sm text-dark">SIGN IN</button> </div>
            </div>
            <div class="d-flex justify-content-center align-items-center h-100">
            </div>
            <div class="position-absolute bottom-0 start-50 translate-middle-x pb-5">
                <div class="d-flex gap-5"> <button class="btn btn-lg text-white"
                        style="background-color: purple;">Personajes</button> <button class="btn btn-lg text-white"
                        style="background-color: purple;">Comunidad</button> <button class="btn btn-lg text-white"
                        style="background-color: purple;">Universos</button> <button class="btn btn-lg text-white"
                        style="background-color: purple;">Episodios</button> </div>
            </div>
        </div>
    </header>




    <!-- ================= CONTENIDO ================= -->
    <div class="container-fluid min-vh-100 d-flex flex-column">

        <div class="row flex-grow-1">

            <!-- ASIDE -->
            <aside class="col-lg-3 col-md-4 border-end border-secondary p-3">
                <h5 class="text-info">🔍 Filtros</h5>

                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select id="statusFilter" class="form-select">
                        <option value="">Todos</option>
                        <option value="alive">Vivo</option>
                        <option value="dead">Muerto</option>
                        <option value="unknown">Desconocido</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Especie</label>
                    <select id="speciesFilter" class="form-select">
                        <option value="">Todas</option>
                        <option value="Human">Humano</option>
                        <option value="Alien">Alien</option>
                    </select>
                </div>

                <div class="d-grid gap-2">
                    <button class="btn btn-success" onclick="applyFilters()">Aplicar filtros</button>
                    <button class="btn btn-outline-secondary" onclick="resetFilters()">Limpiar</button>
                </div>
            </aside>

            <!-- MAIN -->
            <main class="col-lg-9 col-md-8 p-4">

                <section class="bg-secondary p-4 rounded mb-4 shadow-sm">
                    <h4>Bienvenido</h4>
                    <p>Explora personajes reales gracias a la API pública.</p>
                    <span class="badge bg-warning text-dark">Tema: Rick and Morty API</span>
                </section>

                <section class="bg-dark border border-secondary rounded p-3 mb-4">
                    <h5>Personajes encontrados (<span id="count">0</span>)</h5>
                </section>

                <div class="d-flex justify-content-center gap-3 mb-4">
                    <button class="btn btn-outline-light" onclick="changePage(-1)">Anterior</button>
                    <button class="btn btn-outline-light" onclick="changePage(1)">Siguiente</button>
                </div>

                <ul id="characters" class="row row-cols-2 row-cols-md-4 g-3 list-unstyled"></ul>

                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button class="btn btn-outline-light" onclick="changePage(-1)">Anterior</button>
                    <button class="btn btn-outline-light" onclick="changePage(1)">Siguiente</button>
                </div>

            </main>
        </div>

        <!-- FOOTER -->
        <footer class="bg-black text-center py-2">
            <small>Rick and Morty Database - Proyecto Educativo</small>
        </footer>
    </div>

    <!-- ================= JS ================= -->
    <script>
        let page = 1;
        let currentData = [];
        const list = document.getElementById("characters");
        const count = document.getElementById("count");

        function loadCharacters() {
            fetch(`https://rickandmortyapi.com/api/character/?page=${page}`)
                .then(res => res.json())
                .then(data => {
                    currentData = data.results;
                    renderCharacters(currentData);
                });
        }

        function renderCharacters(data) {
            list.innerHTML = "";
            const limited = data.slice(0, 12);
            count.textContent = limited.length;

            limited.forEach(c => {
                list.innerHTML += `
        <li class="col">
            <div class="card h-100 text-center">
                <img src="${c.image}" class="card-img-top">
                <div class="card-body p-2">
                    <h6>${c.name}</h6>
                </div>
            </div>
        </li>`;
            });
        }

        function applyFilters() {
            const status = statusFilter.value;
            const species = speciesFilter.value;

            const filtered = currentData.filter(c =>
                (status === "" || c.status.toLowerCase() === status) &&
                (species === "" || c.species === species)
            );

            renderCharacters(filtered);
        }

        function resetFilters() {
            statusFilter.value = "";
            speciesFilter.value = "";
            renderCharacters(currentData);
        }

        function changePage(dir) {
            page += dir;
            loadCharacters();
        }

        loadCharacters();
    </script>

</body>

</html>
