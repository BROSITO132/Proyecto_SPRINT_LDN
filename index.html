<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Rick and Morty Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-dark text-light">

    <!-- HTML -->
    <header class="img-main" style="
        background-image: url('./img/header.png');
        background-position: center;
        background-size: cover;
        height: 650px;
        ">
        <nav class="navbar navbar-expand-lg sticky-top header-nav-bg" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="/img/Rick_and_Morty.png" alt="Logo" width="150" class="d-inline-block align-text-top">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse " id="navbarNav">
                    <ul class="navbar-nav gap-3 ms-3 ">
                        <li class="nav-item ">
                            <a id="btnPersonajes" class="btn btn-md btn-header fs-4 fw-bold " aria-current="page"
                                href="#personajes">Personajes</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-md btn-header fs-4 fw-bold" aria-current="page" href="#">Comunidad</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-md btn-header fs-4 fw-bold" aria-current="page" href="#">Universos</a>
                        </li>
                        <li class="nav-item">
                            <a id="btnEpisodios" class="btn btn-md btn-header fs-4 fw-bold" aria-current="page"
                                href="#seccion-episodios">Episodios</a>
                        </li>
                    </ul>
                </div>
                <div class="flex-row-reverse">
                    <ul class="navbar-nav gap-3 ms-3">
                        <li class="nav-item">
                            <a class="btn btn-header me-4 fs-5 fw-bold" aria-current="page" href="">SIGN IN</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- ASIDE -->
    <nav class="nav-conf row d-flex justify-content-center align-items-center g-3 mt-4">
        <div class="col-lg-2 col-md-4">
            <select id="statusFilter" class="form-select select-nav fs-4 fw-bold">
                <option value="" selected disabled>Estado</option>
                <option value="">Todos</option>
                <option value="alive">Vivos</option>
                <option value="dead">Muertos</option>
                <option value="unknown">Desconocidos</option>
            </select>
        </div>
        <div class="col-lg-2 col-md-4">
            <select id="speciesFilter" class="form-select select-nav fs-4 fw-bold">
                <option value="" selected disabled>Especie</option>
                <option value="">Todas</option>
                <option value="Human">Humanos</option>
                <option value="Alien">Aliens</option>
            </select>
        </div>

        <div class="col-lg-2 d-flex justify-content-center  gap-2">
            <button class="btn btn-md select-nav fs-6 fw-bold" onclick="applyFilters()">Aplicar</button>
            <button class="btn btn-md select-nav fs-6 fw-bold" onclick="resetFilters()">Limpiar</button>
        </div>
    </nav>
    <!-- ================= CONTENIDO ================= -->

    <!-- MAIN -->
    <main class="container-fluid min-vh-100 d-flex flex-column p-4">

        <!-- SELECTOR PERSONAJES -->
        <section id="personajes" class="row mb-4">

            <div class="col-6">
                <div id="character-info" class="p-4 text-center">
                    <h3>PERSONAJE</h3>
                    <p class="text-muted">Selecciona un personaje</p>
                </div>
            </div>
            <div class="col-6">
                <ul id="characters" class="row row-cols-xs-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3 list-unstyled"></ul>
            </div>
        </section>


        <!--CROUSEL DE ESPISODIOS-->
        <div class="row">
            <section id="seccion-episodios" class="col-lg-12 col-md-12 col-sm-12 rounded mb-4 p-4 shadow-lg" style="background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('fondocarousel.png') !important;
           background-size: cover !important; 
           background-position: center !important;
           background-repeat: no-repeat !important;
           border: 3px solid #b7e152;">
                <div class="text-center mb-4">
                    <h2 class="titulo-episodios">
                        EPISODIOS
                    </h2>
                </div>
                <div id="carouselTemporadas" class="carousel slide">

                    <div class="carousel-inner">

                        <div class="carousel-item active">
                            <div id="temporadas-pag-1" class="row gx-2 justify-content-center p-4">
                            </div>
                        </div>

                        <div class="carousel-item">
                            <div id="temporadas-pag-2" class="row gx-2 justify-content-center p-4">
                            </div>
                        </div>

                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselTemporadas"
                        data-bs-slide="prev" style="width: 5%;">
                        <span class="bg-dark rounded-circle d-flex align-items-center justify-content-center"
                            style="width: 40px; height: 40px;">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        </span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselTemporadas"
                        data-bs-slide="next" style="width: 5%;">
                        <span class="bg-dark rounded-circle d-flex align-items-center justify-content-center"
                            style="width: 40px; height: 40px;">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        </span>
                    </button>
                </div>


            </section>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-black text-center py-2">
        <small>Rick and Morty Database - Proyecto Educativo</small>
    </footer>
    </div>

    <script src="/Js/index.js"></script>
</body>

</html>
