<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Rick and Morty Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-dark text-light">

<!-- HEADER -->
<header class="img-main" style="
        background-image: url('./img/header.png');
        background-position: center;
        background-size: cover;
        height: 650px;
        ">
    <!--NAV-->
    <nav class="navbar navbar-expand-lg sticky-top nav-bg" data-bs-theme="dark">
        <div class="container-fluid">
            <!--LOGO-->
            <a class="navbar-brand" href="#">
                <img src="/img/Rick_and_Morty.png" alt="Logo" width="150" class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!--BOTONES-->
            <div class="collapse navbar-collapse " id="navbarNav">
                <ul class="navbar-nav gap-3 ms-3 ">
                    <li class="nav-item ">
                        <a class="btn btn-md button-conf fs-4 fw-bold " aria-current="page" href="#">Personajes</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-md button-conf fs-4 fw-bold" aria-current="page" href="#">Comunidad</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-md button-conf fs-4 fw-bold" aria-current="page" href="#">Universos</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-md button-conf fs-4 fw-bold" aria-current="page" href="#">Episodios</a>
                    </li>
                </ul>
            </div>
            <!--BOTON DEL FINAL-->
            <div class="flex-row-reverse">
                <ul class="navbar-nav gap-3 ms-3">
                    <li class="nav-item">
                        <a class="btn button-conf me-4 fs-5 fw-bold" aria-current="page" href="#">SIGN IN</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

</header>

<!-- ================= CONTENIDO ================= -->
<div class="container-fluid min-vh-100 d-flex flex-column">

    <div class="row flex-grow-1">

        <!-- ASIDE -->
        <aside class="col-lg-3 col-md-4 border-end border-secondary p-3">
            <h5 class="text-info">🔍 Filtros</h5>

            <div class="mb-3">
                <label class="form-label">Estado</label>
                <select id="statusFilter" class="form-select">
                    <option value="">Todos</option>
                    <option value="alive">Vivo</option>
                    <option value="dead">Muerto</option>
                    <option value="unknown">Desconocido</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Especie</label>
                <select id="speciesFilter" class="form-select">
                    <option value="">Todas</option>
                    <option value="Human">Humano</option>
                    <option value="Alien">Alien</option>
                </select>
            </div>

            <div class="d-grid gap-2">
                <button class="btn btn-success" onclick="applyFilters()">Aplicar filtros</button>
                <button class="btn btn-outline-secondary" onclick="resetFilters()">Limpiar</button>
            </div>
        </aside>


        <!-- MAIN -->
        <main class="col-lg-9 col-md-8 p-4">

            <!-- SELECTOR PERSONAJES -->
            <section class="container-fluid mb-5">
                <div class="row g-4">

                    <div class="col-md-6">
                        <div id="character-info" class="p-4 text-center">
                            <h3>PERSONAJE</h3>
                            <p class="text-muted">Selecciona un personaje</p>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <ul id="characters"
                            class="row row-cols-3 row-cols-sm-4 row-cols-md-5 g-3 list-unstyled">
                        </ul>
                    </div>

                </div>
            </section>


            <!--CROUSEL DE ESPISODIOS-->
            <section id="seccion-episodios" class="container-fluid rounded mb-4 p-4 shadow-lg" style="background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('fondocarousel.png') !important;
           background-size: cover !important; 
           background-position: center !important;
           background-repeat: no-repeat !important;
           border: 3px solid #b7e152;">
                <div class="text-center mb-4">
                    <h2 class="titulo-episodios">
                        EPISODIOS
                    </h2>
                </div>
                <div id="carouselTemporadas" class="carousel slide">

                    <div class="carousel-inner">

                        <div class="carousel-item active">
                            <div id="temporadas-pag-1" class="row gx-2 justify-content-center p-4">
                            </div>
                        </div>

                        <div class="carousel-item">
                            <div id="temporadas-pag-2" class="row gx-2 justify-content-center p-4">
                            </div>
                        </div>

                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselTemporadas"
                            data-bs-slide="prev" style="width: 5%;">
                            <span class="bg-dark rounded-circle d-flex align-items-center justify-content-center"
                                  style="width: 40px; height: 40px;">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            </span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselTemporadas"
                            data-bs-slide="next" style="width: 5%;">
                            <span class="bg-dark rounded-circle d-flex align-items-center justify-content-center"
                                  style="width: 40px; height: 40px;">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            </span>
                    </button>
                </div>


            </section>

        </main>
    </div>

    <!-- FOOTER -->
    <footer class="bg-black text-center py-2">
        <small>Rick and Morty Database - Proyecto Educativo</small>
    </footer>
</div>

<script src="/Js/index.js"></script>
</body>

</html>
